name: Server CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppAttestCore
            directory: Server/AppAttestCore
            wasm: false
            check_args: ""
          - name: NotificationsWorker
            directory: Server/NotificationsWorker
            wasm: true
            check_args: ""
          - name: AdAnalysisWorker
            directory: Server/AdAnalysisWorker
            wasm: true
            check_args: ""
          - name: ModelGatewayWorker
            directory: Server/ModelGatewayWorker
            wasm: true
            check_args: "--lib"
          - name: RemoteTranscriptionWorker
            directory: Server/RemoteTranscriptionWorker
            wasm: true
            check_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the WebAssembly target
        if: matrix.wasm
        run: rustup target add wasm32-unknown-unknown

      - name: Run host tests
        working-directory: ${{ matrix.directory }}
        run: cargo test --locked

      - name: Check the Worker WebAssembly target
        if: matrix.wasm
        working-directory: ${{ matrix.directory }}
        run: cargo check --locked --target wasm32-unknown-unknown ${{ matrix.check_args }}

  deterministic-integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AdAnalysisWorker
            directory: Server/AdAnalysisWorker
          - name: RemoteTranscriptionWorker
            directory: Server/RemoteTranscriptionWorker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Activate Yarn 1.22.22
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install stable Rust and the WebAssembly target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: yarn install --frozen-lockfile

      - name: Run deterministic integration tests
        working-directory: ${{ matrix.directory }}
        run: yarn test:integration

  services:
    name: Service (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PurchaseWorker
            directory: Server/PurchaseWorker
          - name: TranscriptionMediaWorker
            directory: Server/TranscriptionMediaWorker
          - name: Website
            directory: Server/Website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Activate Yarn 1.22.22
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: yarn install --frozen-lockfile

      - name: Test and typecheck PurchaseWorker
        if: matrix.name == 'PurchaseWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn test
          yarn typecheck
          yarn test:integration

      - name: Check TranscriptionMediaWorker
        if: matrix.name == 'TranscriptionMediaWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn typecheck
          yarn test:container

      - name: Verify Website
        if: matrix.name == 'Website'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn lint
          yarn typecheck
          yarn build

  server-ci:
    name: Server CI
    if: always()
    needs:
      - rust
      - deterministic-integration
      - services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every server lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.rust.result }}" != "success" ||
                "${{ needs.deterministic-integration.result }}" != "success" ||
                "${{ needs.services.result }}" != "success" ]]; then
            echo "One or more Server CI lanes did not pass."
            exit 1
          fi
          echo "All Server CI lanes passed."
