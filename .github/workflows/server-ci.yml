name: Server CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  GIT_LFS_SKIP_SMUDGE: "1"

# Pull requests cancel their superseded runs. Pushes to main never do: every
# commit there keeps its own run, so a follow-up push cannot erase its evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Verify cross-component server contracts
        run: |
          ./scripts/check-yarn-workspace.sh
          ./scripts/check-media-ua-pins.sh
          ./scripts/check-wasm-only-test-gating.sh
          python3 ./scripts/check-feed-resource-policy.py

      - name: Run notification contract oracles
        run: node --test scripts/notifications-overhaul/*.test.mjs

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppAttestCore
            directory: Server/AppAttestCore
            wasm: false
            check_args: ""
          - name: MP3FrameCore
            directory: Server/MP3FrameCore
            wasm: true
            check_args: ""
          - name: WorkerDatabaseCore
            directory: Server/WorkerDatabaseCore
            wasm: true
            check_args: "--lib"
          - name: NotificationsWorker
            directory: Server/NotificationsWorker
            wasm: true
            check_args: ""
          - name: FeedPollingWorker
            directory: Server/FeedPollingWorker
            wasm: true
            check_args: ""
          - name: AdAnalysisWorker
            directory: Server/AdAnalysisWorker
            wasm: true
            check_args: ""
          - name: TranscriptAnalysisWorker
            directory: Server/TranscriptAnalysisWorker
            wasm: true
            check_args: ""
          - name: ModelGatewayWorker
            directory: Server/ModelGatewayWorker
            wasm: true
            check_args: "--lib"
          - name: PodcastDirectoryWorker
            directory: Server/PodcastDirectoryWorker
            wasm: true
            check_args: ""
          - name: RemoteTranscriptionWorker
            directory: Server/RemoteTranscriptionWorker
            wasm: true
            check_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the WebAssembly target
        if: matrix.wasm
        run: rustup target add wasm32-unknown-unknown

      - name: Run host tests
        if: matrix.name != 'AdAnalysisWorker' && matrix.name != 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: cargo test --locked

      - name: Run public AdAnalysisWorker host tests
        if: matrix.name == 'AdAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cargo test --locked \
            --lib \
            --test accounting \
            --test app_attest_migrations \
            --test gemini_retry \
            --test job_state \
            --test promo_v3 \
            --test prompt \
            --test routing \
            --test v3_timeout \
            --test validation \
            --test windowing
          python3 -B -m unittest discover -s scripts

      - name: Run public TranscriptAnalysisWorker host tests
        if: matrix.name == 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cargo test --locked \
            --lib \
            --test app_attest_migrations \
            --test coalescing \
            --test gemini_retry \
            --test job_state \
            --test counters_migration \
            --test prompt \
            --test routing \
            --test run_stats \
            --test usage \
            --test validation

      - name: Check the Worker WebAssembly target
        if: matrix.wasm
        working-directory: ${{ matrix.directory }}
        run: cargo check --locked --target wasm32-unknown-unknown ${{ matrix.check_args }}

  deterministic-integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AdAnalysisWorker
            directory: Server/AdAnalysisWorker
          - name: TranscriptAnalysisWorker
            directory: Server/TranscriptAnalysisWorker
          - name: PodcastDirectoryWorker
            directory: Server/PodcastDirectoryWorker
          - name: RemoteTranscriptionWorker
            directory: Server/RemoteTranscriptionWorker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Activate Yarn 4.18.0
        shell: bash
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global yarn@4.18.0
          node --version
          corepack --version
          yarn --version

      - name: Install stable Rust and the WebAssembly target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare public AdAnalysis integration harness
        if: matrix.name == 'AdAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cp wrangler.example.toml wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          flags = (
              'PUBLIC_AD_ANALYSIS_ENABLED = "false"',
              'INTERNAL_AD_ANALYSIS_ENABLED = "false"',
          )
          for flag in flags:
              if contents.count(flag) != 3:
                  raise SystemExit(f"expected three public kill-switch defaults: {flag}")
              contents = contents.replace(flag, flag.replace("false", "true"), 1)
          path.write_text(contents)
          PY
          mkdir -p tests/fixtures
          node --input-type=module --eval \
            "import { writeFileSync } from 'node:fs'; writeFileSync('tests/fixtures/ad_analysis_app_attest_development_fixture.json', '{}\n');"

      - name: Prepare public TranscriptAnalysis integration harness
        if: matrix.name == 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cp wrangler.example.toml wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          public_flag = 'PUBLIC_TRANSCRIPT_ANALYSIS_ENABLED = "false"'
          billing_flag = 'BILLING_REQUIRED = "false"'
          if contents.count(public_flag) != 3:
              raise SystemExit("expected three public transcript-analysis defaults")
          if contents.count(billing_flag) != 3:
              raise SystemExit("expected three public transcript-analysis billing defaults")
          path.write_text(contents.replace(public_flag, public_flag.replace("false", "true"), 1))
          PY

      - name: Prepare public PodcastDirectory integration harness
        if: matrix.name == 'PodcastDirectoryWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cp wrangler.example.toml wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          public_flag = 'PUBLIC_PODCAST_DIRECTORY_ENABLED = "false"'
          if contents.count(public_flag) != 3:
              raise SystemExit("expected three public podcast-directory defaults")
          path.write_text(contents.replace(public_flag, public_flag.replace("false", "true"), 1))
          PY

      - name: Prepare local RemoteTranscription bindings
        if: matrix.name == 'RemoteTranscriptionWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          blocks = (
              '[ai]\nbinding = "AI"\n\n',
              '[[services]]\nbinding = "TRANSCRIPTION_MEDIA_WORKER"\nservice = "your-transcription-media-worker"\n\n',
          )
          for block in blocks:
              if contents.count(block) != 1:
                  raise SystemExit(f"expected one public CI binding block: {block!r}")
              contents = contents.replace(block, "")
          public_flag = 'PUBLIC_REMOTE_TRANSCRIPTION_ENABLED = "false"'
          if contents.count(public_flag) != 3:
              raise SystemExit("expected three public remote-transcription defaults")
          contents = contents.replace(
              public_flag,
              'PUBLIC_REMOTE_TRANSCRIPTION_ENABLED = "true"\nDEV_BEARER_ENABLED = "true"',
              1,
          )
          path.write_text(contents)
          PY

      - name: Run public AdAnalysis integration tests
        if: matrix.name == 'AdAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn build:worker
          yarn exec vitest run -t \
            'routing|rejects an unauthenticated request|challenges|404s internal paths on the public host|rejects malformed internal envelopes and invalid payloads|404s an unknown internal job id'

      - name: Run deterministic TranscriptAnalysis integration tests
        if: matrix.name == 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn build:worker
          yarn exec vitest run
          yarn exec vitest run -c vitest.billing.config.mjs
          yarn workspace opencast-purchase-worker build:test-bundle
          yarn exec vitest run -c vitest.purchase.config.mjs

      - name: Run deterministic PodcastDirectory integration tests
        if: matrix.name == 'PodcastDirectoryWorker'
        working-directory: ${{ matrix.directory }}
        run: yarn test:integration

      - name: Run deterministic RemoteTranscription integration tests
        if: matrix.name == 'RemoteTranscriptionWorker'
        working-directory: ${{ matrix.directory }}
        run: yarn test:integration

  # NotificationsWorker and FeedPollingWorker keep all storage in PostgreSQL.
  # Their suites run on clones of the local test topology's template, installed
  # with the host psql into a PostgreSQL 18.6 service container pinned to the
  # multi-platform index digest (the runner pulls its own platform's entry).
  # Matrix entries share no filesystem, so each one prepares all of its inputs.
  postgres-integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Each entry packages two release Rust Workers; the Notifications entry also
    # builds the storage-fixture Worker.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NotificationsWorker
            directory: Server/NotificationsWorker
          - name: FeedPollingWorker
            directory: Server/FeedPollingWorker
    services:
      postgres:
        image: docker.io/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          # The local topology's fixed superuser password, not a secret.
          POSTGRES_PASSWORD: opencast-local-postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 30
    env:
      OPENCAST_PG_PSQL: host
      OPENCAST_PG_HOST: 127.0.0.1
      OPENCAST_PG_PORT: "55432"
      # The host transport cannot inspect the service container, so the install
      # marker records this reference as requested.
      OPENCAST_PG_IMAGE: docker.io/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Activate Yarn 4.18.0
        shell: bash
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global yarn@4.18.0
          node --version
          corepack --version
          yarn --version

      - name: Install stable Rust and the WebAssembly target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install the PostgreSQL client
        shell: bash
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends postgresql-client

          psql --version

      # The service's own image record. A digest is named as resolved only when
      # the image's repository digests reduce to one platform entry that is not
      # the requested index; anything else is logged as unresolved.
      - name: Record the PostgreSQL service image
        shell: bash
        run: |
          service="${{ job.services.postgres.id }}"
          docker inspect --format '{{.Image}} {{.Config.Image}}' "$service"
          image=$(docker inspect --format '{{.Image}}' "$service")
          docker image inspect --format '{{json .RepoDigests}} {{.Os}}/{{.Architecture}}' "$image"
          requested="${OPENCAST_PG_IMAGE#*@}"
          listed=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" |
            sed -n 's/^.*@//p' | sort -u)
          # local-postgres.sh's rule: the requested index set aside, exactly one
          # remaining digest is the platform image the service runs.
          digests=$(printf '%s\n' "$listed" | grep -v -x -F "$requested" | grep . || true)
          count=$(printf '%s\n' "$digests" | grep -c . || true)
          if [ "$count" -eq 1 ]; then
            echo "image provenance resolved: $digests (requested $OPENCAST_PG_IMAGE)"
          elif [ "$count" -gt 1 ]; then
            echo "image provenance unresolved: multiple (requested $OPENCAST_PG_IMAGE)"
          elif [ -n "$listed" ]; then
            echo "image provenance unresolved: index-not-child (requested $OPENCAST_PG_IMAGE)"
          else
            echo "image provenance unresolved: empty (requested $OPENCAST_PG_IMAGE)"
          fi

      - name: Install the local PostgreSQL topology
        shell: bash
        run: |
          bash Server/NotificationsWorker/postgres/local/local-postgres.sh install
          bash Server/NotificationsWorker/postgres/local/local-postgres.sh status

      # FeedPolling links the notifications crate and its harness boots the
      # packaged notifications Worker, so both entries need the same template.
      - name: Prepare public Notifications integration harness
        working-directory: Server/NotificationsWorker
        run: cp wrangler.example.toml wrangler.toml

      - name: Install dependencies
        run: yarn install --immutable

      - name: Package both Workers
        run: |
          yarn workspace @opencast/notifications-worker deploy:dry-run
          yarn workspace @opencast/feed-polling-worker deploy:dry-run

      - name: Run deterministic Notifications integration tests
        if: matrix.name == 'NotificationsWorker'
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          "$HOME/.cargo/bin/worker-build" --release --out-dir "$RUNNER_TEMP/opencast-storage-fixture-build" \
            --no-default-features --features storage-fixture
          export OPENCAST_FIXTURE_BUILD="$RUNNER_TEMP/opencast-storage-fixture-build"
          node postgres/local/test-local-postgres.mjs
          node tests/postgres/test-sql.mjs
          node tests/postgres/test-database.mjs
          node tests/postgres/test-storage.mjs
          node tests/postgres/test-proxy.mjs
          node tests/postgres/test-timing.mjs
          node tests/postgres/test-witness.mjs
          node tests/catalog-contract-runtime.mjs
          node tests/current-engine-runtime.mjs
          node tests/delivery-runtime.mjs
          node tests/observation-runtime.mjs
          node tests/feed-cancellation-runtime.mjs
          node tests/storage-gc-runtime.mjs
          node tests/identity-cache-runtime.mjs

      - name: Run deterministic FeedPolling integration tests
        if: matrix.name == 'FeedPollingWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          OPENCAST_POSTGRES_BUILD="$GITHUB_WORKSPACE/Server/NotificationsWorker/build" \
            OPENCAST_POLLING_POSTGRES_BUILD="$GITHUB_WORKSPACE/Server/FeedPollingWorker/build" \
            node ../NotificationsWorker/tests/storage-selection-runtime.mjs
          node tests/lifecycle.mjs
          node tests/digest-runtime.mjs
          node tests/review-regressions.mjs
          node tests/stage1-review.mjs
          node tests/alerting.mjs
          node tests/permit-reclaim.mjs
          python3 -B -m unittest discover -s storage_phases

  services:
    name: Service (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PurchaseWorker
            directory: Server/PurchaseWorker
            timeout_minutes: 35
          - name: TranscriptionMediaWorker
            directory: Server/TranscriptionMediaWorker
            timeout_minutes: 50
          - name: ExerciseFeedWorker
            directory: Server/ExerciseFeedWorker
            timeout_minutes: 15
          - name: ShareWorker
            directory: Server/ShareWorker
            timeout_minutes: 20
          - name: MailTriageWorker
            directory: Server/MailTriageWorker
            timeout_minutes: 15
          - name: Website
            directory: Server/Website
            timeout_minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Activate Yarn 4.18.0
        shell: bash
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global yarn@4.18.0
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install TranscriptionMediaWorker test prerequisites
        if: matrix.name == 'TranscriptionMediaWorker'
        shell: bash
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends ffmpeg

          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Prepare PurchaseWorker public test configuration
        if: matrix.name == 'PurchaseWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          placeholder = 'APPLE_BUNDLE_ID = "REPLACE_WITH_APP_BUNDLE_ID"'
          if contents.count(placeholder) != 3:
              raise SystemExit("expected three public bundle-ID placeholders")
          path.write_text(
              contents.replace(
                  placeholder,
                  'APPLE_BUNDLE_ID = "com.connor.opencast"',
                  1,
              )
          )
          PY

      - name: Prepare ExerciseFeedWorker public test configuration
        if: matrix.name == 'ExerciseFeedWorker'
        working-directory: ${{ matrix.directory }}
        run: cp wrangler.example.toml wrangler.toml

      - name: Test and typecheck PurchaseWorker
        if: matrix.name == 'PurchaseWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn test --exclude test/unit/config.spec.mjs
          yarn typecheck
          yarn test:integration

      - name: Check TranscriptionMediaWorker
        if: matrix.name == 'TranscriptionMediaWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn typecheck
          yarn test:container

      - name: Check ExerciseFeedWorker
        if: matrix.name == 'ExerciseFeedWorker'
        working-directory: ${{ matrix.directory }}
        run: yarn test

      - name: Check ShareWorker
        if: matrix.name == 'ShareWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn typecheck
          yarn test
          yarn test:integration
          yarn deploy:dry-run
          yarn deploy:dry-run:prod-staging
          yarn deploy:dry-run:production

      - name: Check MailTriageWorker
        if: matrix.name == 'MailTriageWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn typecheck
          yarn test
          yarn deploy:dry-run
          yarn deploy:dry-run:production

      - name: Verify Website
        if: matrix.name == 'Website'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn lint
          yarn typecheck
          yarn build

  server-ci:
    name: Server CI
    if: always()
    needs:
      - guards
      - rust
      - deterministic-integration
      - postgres-integration
      - services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Each lane ends as success, failure, cancelled or skipped; only success
      # keeps the aggregate green, and every lane in needs is listed here.
      - name: Require every server lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.guards.result }}" != "success" ||
                "${{ needs.rust.result }}" != "success" ||
                "${{ needs.deterministic-integration.result }}" != "success" ||
                "${{ needs.postgres-integration.result }}" != "success" ||
                "${{ needs.services.result }}" != "success" ]]; then
            echo "One or more Server CI lanes did not pass."
            exit 1
          fi
          echo "All Server CI lanes passed."
