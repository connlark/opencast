name: Server CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify cross-component server contracts
        run: |
          ./scripts/check-yarn-workspace.sh
          ./scripts/check-media-ua-pins.sh
          ./scripts/check-wasm-only-test-gating.sh

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppAttestCore
            directory: Server/AppAttestCore
            wasm: false
            check_args: ""
          - name: MP3FrameCore
            directory: Server/MP3FrameCore
            wasm: true
            check_args: ""
          - name: NotificationsWorker
            directory: Server/NotificationsWorker
            wasm: true
            check_args: ""
          - name: AdAnalysisWorker
            directory: Server/AdAnalysisWorker
            wasm: true
            check_args: ""
          - name: TranscriptAnalysisWorker
            directory: Server/TranscriptAnalysisWorker
            wasm: true
            check_args: ""
          - name: ModelGatewayWorker
            directory: Server/ModelGatewayWorker
            wasm: true
            check_args: "--lib"
          - name: PodcastDirectoryWorker
            directory: Server/PodcastDirectoryWorker
            wasm: true
            check_args: ""
          - name: RemoteTranscriptionWorker
            directory: Server/RemoteTranscriptionWorker
            wasm: true
            check_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the WebAssembly target
        if: matrix.wasm
        run: rustup target add wasm32-unknown-unknown

      - name: Run host tests
        if: matrix.name != 'AdAnalysisWorker' && matrix.name != 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: cargo test --locked

      - name: Run public AdAnalysisWorker host tests
        if: matrix.name == 'AdAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cargo test --locked \
            --lib \
            --test app_attest_migrations \
            --test gemini_retry \
            --test job_state \
            --test prompt \
            --test routing \
            --test validation \
            --test windowing

      - name: Run public TranscriptAnalysisWorker host tests
        if: matrix.name == 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cargo test --locked \
            --lib \
            --test app_attest_migrations \
            --test coalescing \
            --test gemini_retry \
            --test job_state \
            --test prompt \
            --test routing \
            --test validation

      - name: Check the Worker WebAssembly target
        if: matrix.wasm
        working-directory: ${{ matrix.directory }}
        run: cargo check --locked --target wasm32-unknown-unknown ${{ matrix.check_args }}

  deterministic-integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AdAnalysisWorker
            directory: Server/AdAnalysisWorker
          - name: TranscriptAnalysisWorker
            directory: Server/TranscriptAnalysisWorker
          - name: PodcastDirectoryWorker
            directory: Server/PodcastDirectoryWorker
          - name: RemoteTranscriptionWorker
            directory: Server/RemoteTranscriptionWorker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Activate Yarn 4.18.0
        shell: bash
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global yarn@4.18.0
          node --version
          corepack --version
          yarn --version

      - name: Install stable Rust and the WebAssembly target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare public AdAnalysis integration harness
        if: matrix.name == 'AdAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cp wrangler.example.toml wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          flags = (
              'PUBLIC_AD_ANALYSIS_ENABLED = "false"',
              'INTERNAL_AD_ANALYSIS_ENABLED = "false"',
          )
          for flag in flags:
              if contents.count(flag) != 3:
                  raise SystemExit(f"expected three public kill-switch defaults: {flag}")
              contents = contents.replace(flag, flag.replace("false", "true"), 1)
          path.write_text(contents)
          PY
          mkdir -p tests/fixtures
          node --input-type=module --eval \
            "import { writeFileSync } from 'node:fs'; writeFileSync('tests/fixtures/ad_analysis_app_attest_development_fixture.json', '{}\n');"

      - name: Prepare public TranscriptAnalysis integration harness
        if: matrix.name == 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cp wrangler.example.toml wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          public_flag = 'PUBLIC_TRANSCRIPT_ANALYSIS_ENABLED = "false"'
          billing_flag = 'BILLING_REQUIRED = "false"'
          if contents.count(public_flag) != 3:
              raise SystemExit("expected three public transcript-analysis defaults")
          if contents.count(billing_flag) != 3:
              raise SystemExit("expected three public transcript-analysis billing defaults")
          path.write_text(contents.replace(public_flag, public_flag.replace("false", "true"), 1))
          PY

      - name: Prepare public PodcastDirectory integration harness
        if: matrix.name == 'PodcastDirectoryWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          cp wrangler.example.toml wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          public_flag = 'PUBLIC_PODCAST_DIRECTORY_ENABLED = "false"'
          if contents.count(public_flag) != 3:
              raise SystemExit("expected three public podcast-directory defaults")
          path.write_text(contents.replace(public_flag, public_flag.replace("false", "true"), 1))
          PY

      - name: Prepare local RemoteTranscription bindings
        if: matrix.name == 'RemoteTranscriptionWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          blocks = (
              '[ai]\nbinding = "AI"\n\n',
              '[[services]]\nbinding = "TRANSCRIPTION_MEDIA_WORKER"\nservice = "your-transcription-media-worker"\n\n',
          )
          for block in blocks:
              if contents.count(block) != 1:
                  raise SystemExit(f"expected one public CI binding block: {block!r}")
              contents = contents.replace(block, "")
          public_flag = 'PUBLIC_REMOTE_TRANSCRIPTION_ENABLED = "false"'
          if contents.count(public_flag) != 3:
              raise SystemExit("expected three public remote-transcription defaults")
          contents = contents.replace(
              public_flag,
              'PUBLIC_REMOTE_TRANSCRIPTION_ENABLED = "true"\nDEV_BEARER_ENABLED = "true"',
              1,
          )
          path.write_text(contents)
          PY

      - name: Run public AdAnalysis integration tests
        if: matrix.name == 'AdAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn build:worker
          yarn exec vitest run -t \
            'routing|rejects an unauthenticated request|challenges|404s internal paths on the public host|rejects malformed internal envelopes and invalid payloads|404s an unknown internal job id'

      - name: Run deterministic TranscriptAnalysis integration tests
        if: matrix.name == 'TranscriptAnalysisWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn build:worker
          yarn exec vitest run
          yarn exec vitest run -c vitest.billing.config.mjs
          yarn workspace opencast-purchase-worker build:test-bundle
          yarn exec vitest run -c vitest.purchase.config.mjs

      - name: Run deterministic PodcastDirectory integration tests
        if: matrix.name == 'PodcastDirectoryWorker'
        working-directory: ${{ matrix.directory }}
        run: yarn test:integration

      - name: Run deterministic RemoteTranscription integration tests
        if: matrix.name == 'RemoteTranscriptionWorker'
        working-directory: ${{ matrix.directory }}
        run: yarn test:integration

  services:
    name: Service (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PurchaseWorker
            directory: Server/PurchaseWorker
            timeout_minutes: 35
          - name: TranscriptionMediaWorker
            directory: Server/TranscriptionMediaWorker
            timeout_minutes: 50
          - name: ExerciseFeedWorker
            directory: Server/ExerciseFeedWorker
            timeout_minutes: 15
          - name: Website
            directory: Server/Website
            timeout_minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Activate Yarn 4.18.0
        shell: bash
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global yarn@4.18.0
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install TranscriptionMediaWorker test prerequisites
        if: matrix.name == 'TranscriptionMediaWorker'
        shell: bash
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends ffmpeg

          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Prepare PurchaseWorker public test configuration
        if: matrix.name == 'PurchaseWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wrangler.toml")
          contents = path.read_text()
          placeholder = 'APPLE_BUNDLE_ID = "REPLACE_WITH_APP_BUNDLE_ID"'
          if contents.count(placeholder) != 3:
              raise SystemExit("expected three public bundle-ID placeholders")
          path.write_text(
              contents.replace(
                  placeholder,
                  'APPLE_BUNDLE_ID = "com.connor.opencast"',
                  1,
              )
          )
          PY

      - name: Prepare ExerciseFeedWorker public test configuration
        if: matrix.name == 'ExerciseFeedWorker'
        working-directory: ${{ matrix.directory }}
        run: cp wrangler.example.toml wrangler.toml

      - name: Test and typecheck PurchaseWorker
        if: matrix.name == 'PurchaseWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn test --exclude test/unit/config.spec.mjs
          yarn typecheck
          yarn test:integration

      - name: Check TranscriptionMediaWorker
        if: matrix.name == 'TranscriptionMediaWorker'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn typecheck
          yarn test:container

      - name: Check ExerciseFeedWorker
        if: matrix.name == 'ExerciseFeedWorker'
        working-directory: ${{ matrix.directory }}
        run: yarn test

      - name: Verify Website
        if: matrix.name == 'Website'
        working-directory: ${{ matrix.directory }}
        run: |
          yarn lint
          yarn typecheck
          yarn build

  server-ci:
    name: Server CI
    if: always()
    needs:
      - guards
      - rust
      - deterministic-integration
      - services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every server lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.guards.result }}" != "success" ||
                "${{ needs.rust.result }}" != "success" ||
                "${{ needs.deterministic-integration.result }}" != "success" ||
                "${{ needs.services.result }}" != "success" ]]; then
            echo "One or more Server CI lanes did not pass."
            exit 1
          fi
          echo "All Server CI lanes passed."
