[package]
name = "opencast-model-gateway-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
worker = "0.8"
worker-macros = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
zeroize = "1.8"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
