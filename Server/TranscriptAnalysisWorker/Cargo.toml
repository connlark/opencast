[package]
name = "opencast-transcript-analysis-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opencast-app-attest-core = { path = "../AppAttestCore" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
worker = { version = "0.8", features = ["d1"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hex = "0.4"
rusqlite = "0.40.1"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
