[package]
name = "opencast-remote-transcription-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
constant_time_eq = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
opencast-app-attest-core = { path = "../AppAttestCore" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly-rounded f64 parsing, required for bit-for-bit
# golden-stitch parity with the Python-generated fixture and the Swift mapper.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
url = "2"
worker = { version = "0.8", features = ["d1"] }
worker-macros = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = "0.40.1"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
