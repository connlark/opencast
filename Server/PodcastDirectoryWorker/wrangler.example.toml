name = "your-podcast-directory-worker"
main = "build/index.js"
compatibility_date = "2026-08-18"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[build]
command = "cargo install -q --locked \"worker-build@0.8.5\" && \"$HOME/.cargo/bin/worker-build\" --release"

[vars]
PUBLIC_PODCAST_DIRECTORY_ENABLED = "false"

[[ratelimits]]
name = "CLIENT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "UPSTREAM_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[env.prod-staging]
name = "your-podcast-directory-worker-prod-staging"
workers_dev = true

[env.prod-staging.vars]
PUBLIC_PODCAST_DIRECTORY_ENABLED = "false"

[[env.prod-staging.ratelimits]]
name = "CLIENT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.prod-staging.ratelimits]]
name = "UPSTREAM_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[env.production]
name = "your-podcast-directory-worker-production"
workers_dev = false

[[env.production.routes]]
pattern = "directory.example.com"
custom_domain = true

[env.production.vars]
PUBLIC_PODCAST_DIRECTORY_ENABLED = "false"

[[env.production.ratelimits]]
name = "CLIENT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "UPSTREAM_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }
