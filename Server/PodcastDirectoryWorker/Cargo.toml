[package]
name = "opencast-podcast-directory-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
worker = "0.8"
worker-macros = "0.8"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
