[package]
name = "opencast-feed-polling-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The local harness's fixture timing hooks (the polling loop's clock and gate,
# the core's close delay) behind private fixture routes. Never enabled by a
# shipped Worker manifest.
storage-fixture = ["opencast-notifications-worker/fixture-hooks"]

[dependencies]
opencast-notifications-worker = { path = "../NotificationsWorker", default-features = false }
worker = { version = "0.8", features = ["queue"] }
worker-macros = "0.8"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
