[package]
name = "opencast-notifications-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
hex = "0.4"
opencast-app-attest-core = { path = "../AppAttestCore" }
quick-xml = { version = "0.38", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
worker = { version = "0.8", features = ["d1"] }
worker-macros = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
base64 = "0.22"
minicbor = "0.25"
rusqlite = "0.40.1"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
