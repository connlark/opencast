# Preserve conventional ecosystem compatibility.
nodeLinker: node-modules

# Supply-chain cooldown: refuse npm versions published less than a day ago at
# resolution time. Pinned explicitly so the policy survives Yarn default
# changes. Immutable installs from yarn.lock never consult it; for an
# intentional upgrade to a fresher version, wait out the gate or use the
# documented one-time bypass (docs/build.md).
npmMinimalAgeGate: 1d

catalog:
  wrangler: 4.123.0
  "@cloudflare/vitest-pool-workers": 0.21.3
  vitest: ^4.1.10
  "@cloudflare/workers-types": ^4
  jsonwebtoken: ^9.0.2
