# Preserve conventional ecosystem compatibility.
nodeLinker: node-modules

# Supply-chain cooldown: refuse npm versions published less than seven days ago
# at resolution time (the 2026 consensus window — npm `min-release-age=7`,
# pnpm `minimumReleaseAge: 10080`). Pinned explicitly so the policy survives
# Yarn default changes. Immutable installs from yarn.lock never consult it; for
# an intentional upgrade to a fresher version, wait out the gate or use the
# documented one-time bypass (docs/build.md). `npmPreapprovedPackages` is the
# per-package exception list if a security patch ever has to jump the queue.
npmMinimalAgeGate: 7d

# Cloudflare toolchain: the vitest plugin pins wrangler and miniflare EXACTLY,
# and wrangler pins workerd exactly. That chain caps every compatibility_date in
# Server/. The plugin releases with every wrangler, so pick the same-day plugin
# whose pins equal these entries and the tree holds a single workerd
# (docs/build.md). @vitest/runner and @vitest/snapshot are the plugin's peers.
catalog:
  wrangler: 4.145.0
  miniflare: 5.20260930.0-alpha
  "@cloudflare/vitest-plugin": 1.3.4
  vitest: ^4.1.11
  "@vitest/runner": ^4.1.11
  "@vitest/snapshot": ^4.1.11
  "@cloudflare/workers-types": 5.20260930.2
  jsonwebtoken: ^9.0.2
